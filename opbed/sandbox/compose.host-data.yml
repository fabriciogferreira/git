# Dados compartilhados dos sandboxes Opbed (1 PostgreSQL + 1 Redis no jarvis).
# Problema: N sandboxes × (pgsql/redis) estourava RAM; isolamento real
# só precisa de database/prefixo. Imagens iguais ao host-card Opbed.
#
# Projeto fixo: hc-opbed-data. Rede: hc-opbed-data.
# Clientes: opbed-hc-pgsql / opbed-hc-redis.

services:
  postgresql:
    image: postgres:18.4-trixie
    container_name: opbed-hc-pgsql
    environment:
      POSTGRES_DB: opbed
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - max_locks_per_transaction=256
    volumes:
      - hc_opbed_pgsql:/var/lib/postgresql
    networks: [hc_opbed_data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d opbed -U root"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.6.3-alpine
    container_name: opbed-hc-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - hc_opbed_redis:/data
    networks: [hc_opbed_data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  hc_opbed_data:
    name: hc-opbed-data
    driver: bridge

volumes:
  hc_opbed_pgsql:
    name: hc-opbed-data_pgsql
  hc_opbed_redis:
    name: hc-opbed-data_redis
