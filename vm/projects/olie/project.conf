# Olie project configuration (sourced by start.sh / project-setup.sh)
PROJECT_NAME=olie
COMPOSE_DIR="${HOME}/git/olie/docker-workspace"
WORKSPACE_FILE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/workspace.code-workspace"

# Cloned by project-setup.sh into GIT_ROOT (~/git). Format: "<url> <relative-path> <branch>"
CLONE_REPOS=(
    "git@github.com:olie-ai/olie-fronts.git olie/olie-fronts develop"
    "git@github.com:olie-ai/api-main.git olie/api-main develop"
    "git@github.com:olie-ai/backoffice.git olie/backoffice master"
    "git@github.com:olie-ai/landing.git olie/landing develop"
    "git@github.com:olie-ai/docker-workspace.git olie/docker-workspace master"
    "git@github.com:olie-ai/websocket.git olie/websocket develop"
)

# After clone: "<relative-path> <command...>" (cwd = repo path under GIT_ROOT)
POST_CLONE=(
    "olie/api-main cp -n .env.example .env"
    "olie/backoffice cp -n .env.example .env"
    "olie/websocket cp -n .env.example .env"
    "olie/landing cp -n .env.example .env"
)

# configs/<name> entries from config.json applied by project-setup.sh
APPLY_CONFIGS=(
    4spaces
    olie-api-main
)

# Wait for this URL after docker compose up (optional; start continues on timeout)
WAIT_URL="http://api.olie.localhost"
WAIT_TIMEOUT_SECONDS=60

CHROMIUM_URLS=(
    "http://devframe.olie.localhost"
    "http://api.olie.localhost"
    "http://landing-page.olie.localhost"
    "http://mail.olie.localhost"
)
