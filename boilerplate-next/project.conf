# boilerplate-next — sourced by project-start.sh / project-setup.sh
# Problema: sem project.conf o menu do project-setup não lista este
# boilerplate, não clona e o login não abre o workspace.
# O `up -d` do login sobe só nextjs-dev. Produção está no profile `prod`
# do compose.yaml: os dois serviços publicam a porta 3000.
PROJECT_NAME=boilerplate-next
GIT_ROOT="${GIT_ROOT:-$HOME/git}"
# Compose do guia Docker (standalone). Arquivo no clone, não nesta pasta.
COMPOSE_DIR="${GIT_ROOT}/boilerplate-next/boilerplate-next"
COMPOSE_FILE="compose.yaml"
WORKSPACE_FILE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/workspace.code-workspace"

# Cloned/pulled by project-setup.sh into GIT_ROOT (~/git). Format: "<url> <relative-path> <branch>"
CLONE_REPOS=(
    "git@github.com:fabriciogferreira/boilerplate-next.git boilerplate-next/boilerplate-next main"
)

# Sem post-clone.sh: ainda não há .env nem passo de bootstrap. O guia Docker não pede.
POST_CLONE=()

# Next escuta 3000. O wait só roda se o compose subir; sem lockfile o build falha e o login segue.
WAIT_URL="http://localhost:3000"
WAIT_TIMEOUT_SECONDS=180

CHROMIUM_URLS=(
    "http://localhost:3000"
)
