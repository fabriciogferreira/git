# Dados compartilhados dos sandboxes boilerplate-laravel (1 PostgreSQL + 1 Redis).
# Problema: N sandboxes × (pgsql/redis) estourava RAM; isolamento real
# só precisa de database/prefixo.
#
# Projeto fixo: hc-boilerplate-laravel-data. Rede: hc-boilerplate-laravel-data.
# Clientes: bl-hc-pgsql / bl-hc-redis.

services:
  postgresql:
    image: postgres:18
    container_name: bl-hc-pgsql
    environment:
      POSTGRES_DB: boilerplate
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - max_locks_per_transaction=256
    volumes:
      - hc_bl_pgsql:/var/lib/postgresql
    networks: [hc_bl_data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d boilerplate -U root"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:alpine
    container_name: bl-hc-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - hc_bl_redis:/data
    networks: [hc_bl_data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  hc_bl_data:
    name: hc-boilerplate-laravel-data
    driver: bridge

volumes:
  hc_bl_pgsql:
    name: hc-boilerplate-laravel-data_pgsql
  hc_bl_redis:
    name: hc-boilerplate-laravel-data_redis
