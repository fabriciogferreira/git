# use-url-query — sourced by project-start.sh / project-setup.sh
# Problema: a WorkVM não tinha definição para este pacote; sem project.conf
# o setup não clona nem abre o workspace. O login também pulava o Docker
# porque o conf não apontava o compose do clone.
PROJECT_NAME=use-url-query
GIT_ROOT="${GIT_ROOT:-$HOME/git}"
# bun install no clone; o container fica de pé (tail). Sem porta HTTP.
COMPOSE_DIR="${GIT_ROOT}/use-url-query/use-url-query"
WORKSPACE_FILE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/workspace.code-workspace"

# Cloned/pulled by project-setup.sh into GIT_ROOT (~/git). Format: "<url> <relative-path> <branch>"
CLONE_REPOS=(
    "git@github.com:fabriciogferreira/use-url-query.git use-url-query/use-url-query main"
)

POST_CLONE=()
