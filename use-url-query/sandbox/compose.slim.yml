# Stack slim do sandbox use-url-query.
# Problema: bun run test (Vitest)/coverage no mesmo container_name fixo do Card brigava
# pelo compose; sem worktree isolado dois jobs pisavam no clone.
#
# Profiles: tests | mutation | e2e | slim
# Env: SB_MEM, SB_CPUS, SB_WORKTREE, SB_BUN_IMAGE
# Default SB_BUN_IMAGE: use-url-query-sandbox-backend:tests (Bun + Node real —
# Vitest coverage precisa de Node; ver Dockerfile.backend).

services:
  # CLI bun run test (Vitest) / tsc — job default_service=backend (mesmo nome dos outros projetos).
  backend:
    image: ${SB_BUN_IMAGE:-use-url-query-sandbox-backend:tests}
    profiles: ["tests", "mutation", "e2e", "slim"]
    working_dir: /srv
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: []
    command: ["sleep", "infinity"]
    volumes:
      - ${SB_WORKTREE}/use-url-query:/srv
      - sb_artifacts:/artifacts
    networks: [sb_net]
    mem_limit: ${SB_MEM:-1g}
    cpus: ${SB_CPUS:-1.0}

networks:
  sb_net:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME}_sb_net

volumes:
  sb_artifacts:
    name: ${COMPOSE_PROJECT_NAME}_artifacts
