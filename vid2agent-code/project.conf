# vid2agent-code project configuration (sourced by project-start.sh / project-setup.sh)
PROJECT_NAME=vid2agent-code
GIT_ROOT="${GIT_ROOT:-$HOME/git}"
# Dev stack: compose.dev.yaml inside the cloned Laravel app.
COMPOSE_DIR="${GIT_ROOT}/vid2agent-code/vid2agent-code"
COMPOSE_FILE="compose.dev.yaml"
WORKSPACE_FILE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/workspace.code-workspace"

# Cloned/pulled by project-setup.sh into GIT_ROOT (~/git). Format: "<url> <relative-path> <branch>"
CLONE_REPOS=(
    "git@github.com:fabriciogferreira/vid2agent-code.git vid2agent-code/vid2agent-code main"
)

# .env do app: post-clone.sh chama lib/laravel-post-clone.sh (php-fpm/workspace leem .env).
POST_CLONE=()

# Nginx maps ${NGINX_PORT:-80}:80
WAIT_URL="http://localhost"
WAIT_TIMEOUT_SECONDS=180

CHROMIUM_URLS=(
    "http://localhost"
    "http://localhost:5173"
)
