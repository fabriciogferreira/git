# Drop-in Limine (Omarchy): i915 SR-IOV on the iGPU PF.
# Install: sudo ./workvm/bin/host-igpu-sriov-setup.sh
# Or:     sudo cp workvm/host/limine-entry-tool.d/i915-sriov.conf /etc/limine-entry-tool.d/ && sudo limine-update
# IOMMU (intel_iommu=on iommu=pt) already lives in vfio-osx.conf on this host.
# module_blacklist=xe: required by strongtz/i915-sriov-dkms so the patched i915 binds the PF.

KERNEL_CMDLINE[default]+="i915.enable_guc=3 i915.max_vfs=7 module_blacklist=xe"
