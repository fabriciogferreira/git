# Drop-in tmpfiles for Looking Glass IVSHMEM (host).
# Install: sudo cp workvm/host/tmpfiles.d/10-looking-glass.conf /etc/tmpfiles.d/
#          sudo systemd-tmpfiles --create /etc/tmpfiles.d/10-looking-glass.conf
# Adjust UID if needed (default: fabricio).

# Type Path               Mode UID       GID Age Argument
f /dev/shm/looking-glass 0660 fabricio kvm -
