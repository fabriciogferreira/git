# Televisão project configuration (sourced by start.sh / project-setup.sh)
PROJECT_NAME=televisao
GIT_ROOT="${GIT_ROOT:-$HOME/git}"
# Compose lives in the cloned televisao-api (sibling of the other TelevisaoHope repos).
COMPOSE_DIR="${GIT_ROOT}/televisao/televisao-api"
WORKSPACE_FILE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/workspace.code-workspace"

# Cloned/pulled by project-setup.sh into GIT_ROOT (~/git). Format: "<url> <relative-path> <branch>"
# Paths must stay siblings — docker-compose.yaml mounts ../televisao-front, etc.
CLONE_REPOS=(
    "git@github.com:TelevisaoHope/televisao-api.git televisao/televisao-api preview"
    "git@github.com:TelevisaoHope/televisao-front.git televisao/televisao-front preview"
    "git@github.com:TelevisaoHope/televisao-meet-front.git televisao/televisao-meet-front preview"
    "git@github.com:TelevisaoHope/televisao-meet-core.git televisao/televisao-meet-core preview"
)

# Heavy bootstrap lives in post-clone.sh (.env, networks, compose up).
POST_CLONE=()

# Wait for this URL after docker compose up (optional; start continues on timeout)
WAIT_URL="http://localhost:8000/up"
WAIT_TIMEOUT_SECONDS=180

CHROMIUM_URLS=(
    "http://localhost:3000"
    "http://localhost:8000"
    "http://localhost:8000/docs"
    "http://localhost:3001"
)
