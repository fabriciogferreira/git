# Opbed project configuration (sourced by start.sh / project-setup.sh)
PROJECT_NAME=opbed
GIT_ROOT="${GIT_ROOT:-$HOME/git}"
# Compose lives in the cloned backend (mounts sibling ../opbed-frontend).
COMPOSE_DIR="${GIT_ROOT}/opbed/opbed-backend"
WORKSPACE_FILE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/workspace.code-workspace"

# Cloned/pulled by project-setup.sh into GIT_ROOT (~/git). Format: "<url> <relative-path> <branch>"
# Paths must stay siblings — docker-compose.yml mounts ../opbed-frontend.
CLONE_REPOS=(
    "git@github.com:Code-TreeOf/opbed-backend.git opbed/opbed-backend main"
    "git@github.com:Code-TreeOf/opbed-frontend.git opbed/opbed-frontend main"
)

# .env bootstrap lives in post-clone.sh
POST_CLONE=()

# Wait for this URL after docker compose up (optional; start continues on timeout)
WAIT_URL="http://localhost:8000"
WAIT_TIMEOUT_SECONDS=180

CHROMIUM_URLS=(
    "http://localhost:3000"
    "http://localhost:8000"
)
