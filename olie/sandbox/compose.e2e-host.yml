# olie-e2e no host-card (Playwright MCP + suite).
# Problema: ensure só subia slim+front; o e2e da WorkVM não existia no
# jarvis e o MCP/suite ficavam sem container (Connecting... / sem alvo).
# network_mode: host — alcança Caddy :80 e *.olie.localhost como o browser.
# Serviço separado de `e2e` do slim (profile sandbox) para não misturar paths.
# restart: "no" — unless-stopped deixava o e2e de pé sozinho após reboot do
# Docker com app/http Exited (card “morto” ainda comia RAM).
# user HOST_UID — 0:0 gravava test-results/report como root/nobody e o
# próximo open falhava em rm -rf do meta worktree (Permission denied).
# Chromium no MCP já usa --no-sandbox (workvm-playwright-mcp.sh).
services:
  olie-e2e:
    profiles: ["slim"]
    build:
      context: ${SB_E2E}
      dockerfile: Dockerfile
    image: olie/e2e
    network_mode: host
    ipc: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    working_dir: /app
    environment:
      E2E_BASE_URL: http://devframe.${SB_DNS_SLUG}.olie.localhost
      E2E_API_URL: http://api.${SB_DNS_SLUG}.olie.localhost
      E2E_USER: ${E2E_USER:-tester@olie.ai}
      E2E_PASSWORD: ${E2E_PASSWORD:-password}
    volumes:
      - ${SB_E2E}/tests:/app/tests
      - ${SB_E2E}/playwright.config.ts:/app/playwright.config.ts
      - ${SB_E2E}/test-results:/app/test-results
      - ${SB_E2E}/playwright-report:/app/playwright-report
    mem_limit: ${SB_E2E_MEM:-1536m}
    cpus: ${SB_E2E_CPUS:-1.0}
    command: ["sleep", "infinity"]
