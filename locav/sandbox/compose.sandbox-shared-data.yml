# Sandbox Locav → stack compartilhado hc-locav-data.
# Problema: slim subia pgsql+redis por sandbox. Desliga data local e aponta
# app para locav-hc-pgsql/redis. SB_DB_* / SB_REDIS_PREFIX vêm do .env.

services:
  postgresql:
    profiles: !override ["__host_card_unused__"]
    volumes: !override []
  redis:
    profiles: !override ["__host_card_unused__"]
    volumes: !override []

  app:
    networks:
      sb_net:
      hc_locav_data:
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: locav-hc-pgsql
      DB_PORT: "5432"
      DB_DATABASE: ${SB_DB_DATABASE:-locav}
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_HOST: locav-hc-redis
      REDIS_PORT: "6379"
      REDIS_PREFIX: ${SB_REDIS_PREFIX:-}
    depends_on: !override {}

  http:
    networks:
      sb_net:
      hc_locav_data:
    depends_on: !override
      app:
        condition: service_started

  e2e:
    networks:
      sb_net:
      hc_locav_data:
    depends_on: !override
      http:
        condition: service_started

networks:
  hc_locav_data:
    external: true
    name: hc-locav-data
