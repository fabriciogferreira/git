# Stack slim do sandbox Locav.
# Problema: Sail do clone usa container_name/portas fixas — impede N sandboxes.
# Este arquivo é autônomo; data real vem de hc-locav-data via
# compose.sandbox-shared-data.yml (mysql/redis aqui ficam unused com shared).
#
# Profiles: tests | mutation | e2e | slim
# Env: SB_MEM, SB_CPUS, SB_WORKTREE

services:
  postgresql:
    image: postgres:18.4-trixie
    profiles: ["tests", "mutation", "e2e", "slim"]
    environment:
      POSTGRES_DB: locav_sandbox
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    volumes:
      - sb_pgsql:/var/lib/postgresql
    networks: [sb_net]
    mem_limit: ${SB_MEM:-1g}
    cpus: ${SB_CPUS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d locav_sandbox -U root"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.6.3-alpine
    profiles: ["tests", "mutation", "e2e", "slim"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - sb_redis:/data
    networks: [sb_net]
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: php:8.3-cli
    profiles: ["tests", "mutation", "e2e", "slim"]
    working_dir: /work
    volumes:
      - ${SB_WORKTREE}:/work
      - sb_artifacts:/artifacts
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_DATABASE: locav_sandbox
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks: [sb_net]
    mem_limit: ${SB_MEM:-1g}
    cpus: ${SB_CPUS:-1.0}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sleep", "infinity"]

  http:
    image: php:8.3-cli
    profiles: ["tests", "mutation", "e2e", "slim"]
    working_dir: /work
    volumes:
      - ${SB_WORKTREE}:/work
    networks: [sb_net]
    mem_limit: 256m
    cpus: "0.25"
    depends_on:
      - app
    command: ["php", "-S", "0.0.0.0:8000", "-t", "/work"]

  e2e:
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    profiles: ["e2e"]
    working_dir: /e2e
    ipc: host
    environment:
      E2E_BASE_URL: http://http:8000
      E2E_API_URL: http://http:8000
    volumes:
      - ${SB_WORKTREE}/e2e:/e2e
      - sb_artifacts:/artifacts
    networks: [sb_net]
    mem_limit: ${SB_MEM:-1g}
    cpus: ${SB_CPUS:-1.0}
    depends_on:
      - http
      - postgresql
      - redis
    command: ["sleep", "infinity"]

networks:
  sb_net:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME}_sb_net

volumes:
  sb_pgsql:
    name: ${COMPOSE_PROJECT_NAME}_pgsql
  sb_redis:
    name: ${COMPOSE_PROJECT_NAME}_redis
  sb_artifacts:
    name: ${COMPOSE_PROJECT_NAME}_artifacts
