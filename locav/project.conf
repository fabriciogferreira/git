# Locav — sourced by project-start.sh / project-setup.sh
PROJECT_NAME=locav
# Nome do arquivo em mcps/ (MCP=olie → mcps/olie.json). Board via OlieFlowAi.
MCP=olie
GIT_ROOT="${GIT_ROOT:-$HOME/git}"
# Compose no clone da API (monta o sibling ../locav-front).
COMPOSE_DIR="${GIT_ROOT}/locav/LocavApi"
WORKSPACE_FILE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/workspace.code-workspace"

# Format: "<url> <relative-path> <branch>"
# Front path must be locav-front — docker-compose.yml mounts ../locav-front.
CLONE_REPOS=(
    "git@github.com:enterscience/LocavApi.git locav/LocavApi preview"
    "git@github.com:enterscience/LocavFront.git locav/locav-front preview"
)

POST_CLONE=()

# README: http://localhost/api/hello (APP_PORT default 80).
WAIT_URL="http://localhost/api/hello"
WAIT_TIMEOUT_SECONDS=180

CHROMIUM_URLS=(
    "http://localhost:3000"
    "http://localhost/api/hello"
)
