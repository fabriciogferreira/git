# Standalone Playwright runner for televisao-meet-front.
# Uses host networking so Chromium's localhost matches VITE_* env
# (API :8000, core :10001) and the published meet front port (:3001).
#
# Stack must already be up: cd ../televisao-api && docker compose up -d
# Run tests: ./run.sh

services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile
    image: televisao/meet-front-e2e
    container_name: televisao-meet-front-e2e
    ipc: host
    network_mode: host
    # Start as root so entrypoint can fix bind-mount perms, then drop to pwuser.
    user: "0:0"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      E2E_BASE_URL: ${E2E_BASE_URL:-http://localhost:3001}
      E2E_API_URL: ${E2E_API_URL:-http://localhost:8000}
      E2E_MEET_ROOM: ${E2E_MEET_ROOM:-e2e-smoke}
    volumes:
      - ./tests:/app/tests
      - ./playwright.config.ts:/app/playwright.config.ts
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
