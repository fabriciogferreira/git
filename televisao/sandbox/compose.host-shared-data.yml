# Host-card Televisão → stack compartilhado hc-televisao-data.
# Problema: cada card subia pgsql+redis próprios. Desliga os dois no
# compose.host.yml e aponta backend para televisao-hc-*.
# SB_DB_DATABASE / SB_REDIS_PREFIX vêm do .env.

services:
  postgresql:
    profiles: !override ["__host_card_unused__"]
    volumes: !override []
  redis:
    profiles: !override ["__host_card_unused__"]
    volumes: !override []

  backend:
    networks:
      hc_net:
      hc_televisao_data:
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: televisao-hc-pgsql
      DB_PORT: "5432"
      DB_DATABASE: ${SB_DB_DATABASE:-db_televisao}
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_HOST: televisao-hc-redis
      REDIS_PORT: "6379"
      REDIS_PREFIX: ${SB_REDIS_PREFIX:-}
    depends_on: !override {}

networks:
  hc_televisao_data:
    external: true
    name: hc-televisao-data
