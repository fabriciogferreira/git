# Dados compartilhados dos host-cards e sandboxes Televisão
# (1 PostgreSQL + 1 Redis no jarvis).
# Problema: N cards/sandboxes × (pgsql/redis) estourava RAM; isolamento real
# só precisa de database/prefixo. Imagens ≈ compose.host.yml (postgres:17.5,
# redis:8.8).
#
# Projeto fixo: hc-televisao-data. Rede: hc-televisao-data.
# Clientes: televisao-hc-pgsql / televisao-hc-redis.

services:
  postgresql:
    image: postgres:17.5-bookworm
    container_name: televisao-hc-pgsql
    environment:
      POSTGRES_DB: db_televisao
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    command:
      - postgres
      - -c
      - max_connections=300
    volumes:
      - hc_televisao_pgsql:/var/lib/postgresql/data
    networks: [hc_televisao_data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d db_televisao -U root"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.8.0-trixie
    container_name: televisao-hc-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - hc_televisao_redis:/data
    networks: [hc_televisao_data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  hc_televisao_data:
    name: hc-televisao-data
    driver: bridge

volumes:
  hc_televisao_pgsql:
    name: hc-televisao-data_pgsql
  hc_televisao_redis:
    name: hc-televisao-data_redis
